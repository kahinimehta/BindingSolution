<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="BindingSolution logo">
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#235139"/>
      <stop offset="1" stop-color="#1b3f30"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b765"/>
      <stop offset="0.5" stop-color="#b3892f"/>
      <stop offset="1" stop-color="#9a7426"/>
    </linearGradient>
  </defs>
  <!-- clothbound cover -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#cloth)"/>
  <!-- inset foil frame -->
  <rect x="18" y="18" width="84" height="84" rx="15" fill="none" stroke="url(#foil)" stroke-width="1.6" opacity="0.55"/>
  <!-- open book mark -->
  <g fill="none" stroke="url(#foil)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 40 C 51 33, 39 33, 32 37 L 32 78 C 39 74, 51 74, 60 81"/>
    <path d="M60 40 C 69 33, 81 33, 88 37 L 88 78 C 81 74, 69 74, 60 81"/>
    <path d="M60 40 L 60 81"/>
  </g>
  <!-- brass foil "page" dots: the connective threads -->
  <g fill="#d8b765">
    <circle cx="44" cy="50" r="1.7"/><circle cx="44" cy="58" r="1.7"/><circle cx="44" cy="66" r="1.7"/>
    <circle cx="76" cy="50" r="1.7"/><circle cx="76" cy="58" r="1.7"/><circle cx="76" cy="66" r="1.7"/>
  </g>
</svg>
