<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Reading strategies view">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#2c5d49"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#254f3f"/>
    </linearGradient>
    <filter id="shellShadow" x="-4%" y="-2%" width="108%" height="104%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1f4636" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1f4636" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1000" height="560" fill="#f4efe4"/>

  <g filter="url(#shellShadow)">
    <rect x="50" y="0" width="900" height="560" fill="#f4efe4"/>
    <rect x="50" y="0" width="322" height="560" fill="url(#green)"/>
    <line x1="372" y1="0" x2="372" y2="560" stroke="#caa14a" stroke-width="2" stroke-opacity="0.42"/>

    <g transform="translate(50, 0)">
      <text x="40" y="30" fill="#eef3ee" font-family="Montserrat, system-ui, sans-serif" font-size="17.9" font-weight="700">BindingSolution</text>
      <rect x="18" y="202" width="252" height="38" rx="11" fill="rgba(255,255,255,0.14)" stroke="#caa14a" stroke-width="1.5"/>
      <text x="30" y="218" fill="#fff" font-family="system-ui, sans-serif" font-size="14.1" font-weight="600">Strategies</text>
      <text x="30" y="231" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="9.6">Reading plans</text>

      <rect x="18" y="458" width="252" height="30" rx="11" fill="rgba(0,0,0,0.32)" stroke="rgba(202,161,74,0.4)"/>
      <text x="32" y="478" fill="#fff" font-family="system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.6">RUNNING</text>
      <rect x="234" y="466" width="20" height="16" rx="8" fill="rgba(179,137,47,0.45)"/>
      <text x="244" y="477" fill="#fff8e8" font-size="8.5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700">1</text>
      <rect x="18" y="494" width="252" height="38" rx="10" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.06)"/>
      <text x="30" y="512" fill="#eef3ee" font-size="9.5" font-weight="600" font-family="system-ui, sans-serif">Reading plan</text>
      <text x="30" y="526" fill="#9fb3a8" font-size="8.5" font-family="system-ui, sans-serif">Designing reading strategy</text>
      <rect x="30" y="528" width="160" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
      <rect x="30" y="528" width="64" height="4" rx="2" fill="#b3892f"/>
      <rect x="18" y="538" width="88" height="16" rx="8" fill="rgba(0,0,0,0.2)"/>
      <circle cx="28" cy="546" r="3" fill="#7fce9b"/>
      <text x="36" y="549" fill="#cbdbd1" font-size="8.3" font-family="system-ui, sans-serif" font-weight="600">claude opus</text>
      <rect x="112" y="538" width="52" height="16" rx="8" fill="rgba(0,0,0,0.2)"/>
      <circle cx="122" cy="546" r="3" fill="#7fce9b"/>
      <text x="130" y="549" fill="#cbdbd1" font-size="8.3" font-family="system-ui, sans-serif" font-weight="600">Zotero</text>
    </g>

    <rect x="372" y="0" width="578" height="84" fill="url(#hero)"/>
    <text x="382" y="42" fill="#fff" font-family="Montserrat, system-ui, sans-serif" font-size="32.0" font-weight="600">Reading strategies</text>
    <text x="382" y="62" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="12.8">Compose ordered reading paths across projects for a specific goal.</text>

    <g transform="translate(382, 100)">
      <rect x="0" y="0" width="552" height="390" rx="12" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="20" y="32" fill="#1f4636" font-family="Montserrat, system-ui, sans-serif" font-size="19.2" font-weight="600">Compose a reading plan</text>
      <text x="20" y="48" fill="#8a8478" font-family="system-ui, sans-serif" font-size="12.2">Pick the projects to combine and state your goal.</text>
      <rect x="20" y="60" width="240" height="28" rx="8" fill="#faf6ec" stroke="#d3c8b0"/>
      <rect x="22" y="62" width="116" height="24" rx="7" fill="#1f4636"/>
      <text x="80" y="78" fill="#fff" font-family="system-ui, sans-serif" font-size="10.9" font-weight="600" text-anchor="middle">I choose projects</text>
      <rect x="20" y="128" width="124" height="48" rx="8" fill="#eef4f0" stroke="#1f4636"/>
      <text x="34" y="148" fill="#211f1a" font-family="system-ui, sans-serif" font-size="12.2" font-weight="600">Fairness in ML</text>
      <rect x="152" y="128" width="124" height="48" rx="8" fill="#fff" stroke="#d3c8b0"/>
      <text x="166" y="148" fill="#211f1a" font-family="system-ui, sans-serif" font-size="12.2" font-weight="600">Causal Inference</text>
      <rect x="20" y="296" width="136" height="32" rx="9" fill="#1f4636"/>
      <text x="88" y="316" fill="#f2f7f3" font-family="system-ui, sans-serif" font-size="12.2" font-weight="600" text-anchor="middle">&#x21AF; Generate strategy</text>
      <text x="20" y="352" fill="#5a564c" font-family="system-ui, sans-serif" font-size="12.2" font-weight="600">Saved plans</text>
      <rect x="20" y="362" width="512" height="44" rx="9" fill="#fff" stroke="#d3c8b0"/>
      <text x="34" y="382" fill="#1f4636" font-family="system-ui, sans-serif" font-size="12.8" font-weight="600">Reading plan: Fairness in ML + Causal Inference</text>
      <text x="34" y="398" fill="#8a8478" font-family="system-ui, sans-serif" font-size="10.9">4 papers &#xB7; 3 h &#xB7; 2 days &#xB7; from spec</text>
    </g>
  </g>

  <text x="500" y="548" fill="#8a8478" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Illustrative UI mock &#x2014; reading strategies; Running panel shows indeterminate plan generation.</text>
</svg>
