<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Spec upload and library matches tab">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#2c5d49"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#254f3f"/>
    </linearGradient>
    <filter id="shellShadow" x="-4%" y="-2%" width="108%" height="104%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1f4636" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1f4636" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="#f4efe4"/>

  <g filter="url(#shellShadow)">
    <rect x="50" y="0" width="900" height="520" fill="#f4efe4"/>
    <rect x="50" y="0" width="288" height="520" fill="url(#green)"/>
    <line x1="338" y1="0" x2="338" y2="520" stroke="#caa14a" stroke-width="2" stroke-opacity="0.42"/>

    <g transform="translate(50, 0)">
      <text x="58" y="30" fill="#eef3ee" font-family="Georgia, serif" font-size="14" font-weight="700">BindingSolution</text>
      <rect x="18" y="246" width="252" height="38" rx="11" fill="rgba(255,255,255,0.14)" stroke="#caa14a" stroke-width="1.5"/>
      <text x="30" y="262" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Spec</text>
      <text x="30" y="275" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="7.5">Upload &amp; screen library</text>
    </g>

    <rect x="338" y="0" width="612" height="84" fill="url(#hero)"/>
    <text x="358" y="42" fill="#fff" font-family="Georgia, serif" font-size="25" font-weight="600">Spec</text>
    <text x="358" y="62" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="10">Upload a brief, screen your library, or discover new papers on PubMed.</text>

    <g transform="translate(358, 96)">
      <rect x="0" y="0" width="148" height="28" rx="14" fill="#1f4636"/>
      <text x="74" y="18" fill="#fff" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Upload &amp; manage</text>
      <rect x="156" y="0" width="132" height="28" rx="14" fill="#fffdf8" stroke="#d3c8b0"/>
      <text x="222" y="18" fill="#5a564c" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Suggested papers</text>

      <rect x="0" y="40" width="552" height="100" rx="10" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="276" y="72" fill="#211f1a" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Drop a PDF, Word, Markdown, or text file</text>
      <rect x="16" y="100" width="100" height="26" rx="7" fill="#1f4636"/>
      <text x="66" y="117" fill="#f2f7f3" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">&#x2726; Save spec</text>

      <text x="0" y="162" fill="#1f4636" font-family="Georgia, serif" font-size="13" font-weight="600">Library matches</text>
      <rect x="430" y="148" width="122" height="26" rx="7" fill="#1f4636"/>
      <text x="491" y="165" fill="#f2f7f3" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">&#x21AF; Build reading plan</text>
      <rect x="0" y="172" width="552" height="64" rx="9" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="14" y="194" fill="#1f4636" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Auditing Recommender Systems for Demographic Skew</text>
      <rect x="14" y="204" width="400" height="20" rx="5" fill="#eef4f0" stroke="#cfe0d6"/>
      <text x="22" y="218" fill="#1f4636" font-family="system-ui, sans-serif" font-size="8">Shares fairness focus with your grant aim.</text>
    </g>
  </g>

  <text x="500" y="508" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Illustrative UI mock &#x2014; Spec upload tab with library matches.</text>
</svg>
