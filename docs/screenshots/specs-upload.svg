<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-label="Project specs Upload and manage tab">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#2c5d49"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#254f3f"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1f4636" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="920" height="500" fill="#f4efe4"/>
  <rect x="0" y="0" width="228" height="500" fill="url(#green)"/>
  <line x1="228" y1="0" x2="228" y2="500" stroke="#caa14a" stroke-width="2" stroke-opacity="0.42"/>

  <text x="20" y="40" fill="#eef3ee" font-family="Georgia, serif" font-size="17" font-weight="700">BindingSolution</text>
  <rect x="16" y="252" width="196" height="50" rx="11" fill="rgba(255,255,255,0.14)" stroke="#caa14a" stroke-width="1.5"/>
  <text x="28" y="274" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Project specs</text>
  <text x="28" y="290" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="8.5">Paper suggestions</text>

  <rect x="228" y="0" width="692" height="84" fill="url(#hero)"/>
  <text x="248" y="48" fill="#fff" font-family="Georgia, serif" font-size="28" font-weight="600">Project specs</text>
  <text x="248" y="68" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="11">Upload a project description and see which library papers are relevant.</text>

  <g transform="translate(248, 100)">
    <rect x="0" y="0" width="156" height="32" rx="16" fill="#1f4636"/>
    <text x="78" y="20" fill="#fff" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Upload &amp; manage</text>
    <rect x="164" y="0" width="140" height="32" rx="16" fill="#fffdf8" stroke="#d3c8b0"/>
    <text x="234" y="20" fill="#5a564c" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Suggested papers</text>

    <rect x="0" y="48" width="652" height="150" rx="12" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
    <rect x="18" y="66" width="616" height="68" rx="10" fill="#faf6ec" stroke="#d3c8b0" stroke-dasharray="6 4"/>
    <text x="326" y="98" fill="#211f1a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Drop a PDF, Word, Markdown, or text file</text>
    <text x="326" y="116" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">.pdf · .doc · .docx · .md · .txt — or paste below</text>
    <rect x="18" y="148" width="120" height="32" rx="8" fill="#1f4636"/>
    <text x="78" y="168" fill="#f2f7f3" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Save spec</text>

    <text x="0" y="224" fill="#1f4636" font-family="Georgia, serif" font-size="14" font-weight="600">Your specs</text>
    <rect x="0" y="234" width="652" height="56" rx="10" fill="#fffdf8" stroke="#e2d9c6"/>
    <text x="16" y="258" fill="#211f1a" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Fairness grant aim</text>
    <text x="16" y="274" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9">We study fairness and calibration in recommender systems…</text>
    <rect x="524" y="246" width="116" height="28" rx="8" fill="#1f4636"/>
    <text x="582" y="264" fill="#fff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Find relevant papers</text>
  </g>

  <text x="248" y="484" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9">Illustrative UI mock — Upload &amp; manage tab.</text>
</svg>
