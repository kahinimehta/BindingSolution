<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-label="Project specs Upload and manage tab">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#2c5d49"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#254f3f"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1f4636" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="980" height="480" fill="#f4efe4"/>
  <rect x="0" y="0" width="200" height="480" fill="url(#green)"/>
  <text x="18" y="36" fill="#eef3ee" font-family="Georgia, serif" font-size="15" font-weight="700">BindingSolution</text>
  <rect x="14" y="248" width="172" height="48" rx="9" fill="rgba(255,255,255,0.14)" stroke="#caa14a" stroke-width="1.2"/>
  <text x="48" y="272" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Project specs</text>
  <text x="48" y="284" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="8">Paper suggestions</text>

  <rect x="200" y="0" width="780" height="72" fill="url(#hero)"/>
  <text x="222" y="30" fill="#caa14a" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1.1">STEP 4</text>
  <text x="222" y="52" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="600">Project specs</text>

  <g transform="translate(222, 92)">
    <rect x="0" y="0" width="148" height="30" rx="15" fill="#1f4636"/>
    <text x="74" y="19" fill="#fff" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Upload &amp; manage</text>
    <rect x="156" y="0" width="132" height="30" rx="15" fill="#fffdf8" stroke="#d3c8b0"/>
    <text x="222" y="19" fill="#5a564c" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Suggested papers</text>

    <rect x="0" y="44" width="716" height="64" rx="10" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
    <rect x="0" y="44" width="4" height="64" rx="10" fill="#caa14a"/>
    <text x="16" y="68" fill="#8a8478" font-family="system-ui, sans-serif" font-size="8" letter-spacing="0.8">OVERVIEW</text>
    <text x="16" y="86" fill="#1f4636" font-family="Georgia, serif" font-size="13" font-weight="600">Upload a project spec</text>
    <text x="16" y="100" fill="#5a564c" font-family="system-ui, sans-serif" font-size="9">Grant aim, proposal, or project description. Irrelevant files are rejected.</text>

    <rect x="0" y="124" width="716" height="148" rx="12" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
    <rect x="18" y="142" width="680" height="72" rx="10" fill="#faf6ec" stroke="#d3c8b0" stroke-dasharray="6 4"/>
    <text x="358" y="172" fill="#211f1a" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Drop a PDF, Word, Markdown, or text file</text>
    <text x="358" y="190" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">.pdf · .doc · .docx · .md · .txt  or paste below</text>

    <text x="18" y="234" fill="#5a564c" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Title</text>
    <rect x="18" y="240" width="680" height="22" rx="6" fill="#fff" stroke="#d3c8b0"/>
    <rect x="18" y="272" width="120" height="28" rx="8" fill="#1f4636"/>
    <text x="78" y="290" fill="#f2f7f3" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Save spec</text>

    <text x="0" y="296" fill="#1f4636" font-family="Georgia, serif" font-size="12" font-weight="600">Your specs</text>
    <rect x="0" y="306" width="716" height="52" rx="10" fill="#fffdf8" stroke="#e2d9c6"/>
    <text x="16" y="328" fill="#211f1a" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Fairness grant aim</text>
    <text x="16" y="344" fill="#8a8478" font-family="system-ui, sans-serif" font-size="8">We study fairness and calibration in recommender systems&</text>
    <rect x="590" y="318" width="108" height="24" rx="8" fill="#1f4636"/>
    <text x="644" y="334" fill="#fff" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Find relevant papers</text>
  </g>

  <text x="222" y="464" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9">Illustrative UI mock  Upload &amp; manage tab.</text>
</svg>
