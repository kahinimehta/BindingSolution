    <text x="69" y="36" fill="#8a8478" font-size="7.5" text-anchor="middle" font-family="system-ui, sans-serif">ACTIVE PROJECTS</text>

    <rect x="148" y="0" width="138" height="46" rx="8" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
    <text x="217" y="22" fill="#1f4636" font-size="18" font-weight="700" text-anchor="middle" font-family="Georgia, serif">13</text>
    <text x="217" y="36" fill="#8a8478" font-size="7.5" text-anchor="middle" font-family="system-ui, sans-serif">PAPERS</text>

    <rect x="296" y="0" width="138" height="46" rx="8" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
    <text x="365" y="22" fill="#1f4636" font-size="18" font-weight="700" text-anchor="middle" font-family="Georgia, serif">2</text>
    <text x="365" y="36" fill="#8a8478" font-size="7.5" text-anchor="middle" font-family="system-ui, sans-serif">EXCLUDED</text>

    <text x="0" y="78" fill="#1f4636" font-family="Georgia, serif" font-size="15" font-weight="600">Your projects</text>
    <text x="0" y="94" fill="#5a564c" font-family="system-ui, sans-serif" font-size="10">Collections with 2+ papers — categorize and analyze these.</text>

    <rect x="0" y="108" width="220" height="112" rx="10" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
    <rect x="0" y="108" width="4" height="112" rx="10" fill="#caa14a"/>
    <text x="16" y="136" fill="#211f1a" font-family="Georgia, serif" font-size="14" font-weight="600">Graph Neural Networks</text>
    <text x="16" y="154" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9.5">4 papers</text>

    <rect x="232" y="108" width="220" height="112" rx="10" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
    <text x="248" y="136" fill="#211f1a" font-family="Georgia, serif" font-size="14" font-weight="600">Fairness in ML</text>
    <text x="248" y="154" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9.5">3 papers</text>

    <rect x="464" y="108" width="220" height="112" rx="10" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
    <text x="480" y="136" fill="#211f1a" font-family="Georgia, serif" font-size="14" font-weight="600">Causal Inference</text>
    <text x="480" y="154" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9.5">3 papers</text>

    <text x="0" y="252" fill="#1f4636" font-family="Georgia, serif" font-size="14" font-weight="600">Excluded collections</text>
    <rect x="0" y="264" width="220" height="68" rx="10" fill="#faf6ec" stroke="#d3c8b0" stroke-dasharray="5 4"/>
    <text x="16" y="290" fill="#5a564c" font-family="Georgia, serif" font-size="11" font-weight="600">Empty folder</text>
    <text x="16" y="306" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9">0 papers</text>
  </g>

  <text x="248" y="582" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9">Illustrative UI mock — demo library.</text>
</svg>
