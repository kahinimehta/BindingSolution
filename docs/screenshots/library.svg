<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" role="img" aria-label="BindingSolution library view showing active and excluded collections">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#2c5d49"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#254f3f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1f4636" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1120" height="720" fill="#f4efe4"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="220" height="720" fill="url(#green)"/>
  <text x="24" y="42" fill="#eef3ee" font-family="Georgia, serif" font-size="18" font-weight="700">BindingSolution</text>
  <text x="24" y="60" fill="#caa14a" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1.4">AI READING ROOM</text>
  <rect x="18" y="88" width="184" height="54" rx="10" fill="rgba(255,255,255,0.14)" stroke="#caa14a" stroke-width="1.5"/>
  <rect x="28" y="100" width="24" height="24" rx="7" fill="#b3892f"/>
  <text x="60" y="114" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Library</text>
  <text x="60" y="128" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="9">Projects &amp; papers</text>

  <!-- hero -->
  <rect x="220" y="0" width="900" height="92" fill="url(#hero)"/>
  <text x="252" y="34" fill="#caa14a" font-family="system-ui, sans-serif" font-size="10" letter-spacing="1.2">STEP 1</text>
  <text x="252" y="62" fill="#fff" font-family="Georgia, serif" font-size="28" font-weight="600">Library</text>
  <text x="252" y="82" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="12">Your Zotero collections, categorized and ready to explore.</text>

  <!-- KPI strip -->
  <rect x="220" y="92" width="900" height="58" fill="#fffdf8" stroke="#e2d9c6"/>
  <g font-family="system-ui, sans-serif">
    <rect x="252" y="104" width="120" height="34" rx="8" fill="#eef4f0" stroke="#c4dccd"/>
    <text x="312" y="122" fill="#1f4636" font-size="18" font-weight="700" text-anchor="middle">4</text>
    <text x="312" y="134" fill="#8a8478" font-size="8" text-anchor="middle">ACTIVE PROJECTS</text>
    <rect x="384" y="104" width="120" height="34" rx="8" fill="#efe8d8" stroke="#e2d9c6"/>
    <text x="444" y="122" fill="#1f4636" font-size="18" font-weight="700" text-anchor="middle">13</text>
    <text x="444" y="134" fill="#8a8478" font-size="8" text-anchor="middle">PAPERS</text>
    <rect x="516" y="104" width="120" height="34" rx="8" fill="#efe8d8" stroke="#e2d9c6"/>
    <text x="576" y="122" fill="#1f4636" font-size="18" font-weight="700" text-anchor="middle">2</text>
    <text x="576" y="134" fill="#8a8478" font-size="8" text-anchor="middle">EXCLUDED</text>
  </g>

  <!-- main content -->
  <text x="252" y="188" fill="#1f4636" font-family="Georgia, serif" font-size="16" font-weight="600">Your projects</text>
  <text x="252" y="206" fill="#5a564c" font-family="system-ui, sans-serif" font-size="11">Collections with 2+ papers  categorize and analyze these.</text>

  <!-- active cards -->
  <g filter="url(#shadow)">
    <rect x="252" y="224" width="250" height="118" rx="12" fill="#fffdf8" stroke="#e2d9c6"/>
    <rect x="252" y="224" width="4" height="118" rx="12" fill="#caa14a"/>
    <text x="272" y="252" fill="#211f1a" font-family="Georgia, serif" font-size="14" font-weight="600">Graph Neural Networks</text>
    <text x="272" y="270" fill="#8a8478" font-family="system-ui, sans-serif" font-size="10">4 papers</text>
    <rect x="272" y="284" width="88" height="18" rx="9" fill="#e6efe9" stroke="#c4dccd"/>
    <text x="316" y="297" fill="#1f4636" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">ML · applied</text>

    <rect x="518" y="224" width="250" height="118" rx="12" fill="#fffdf8" stroke="#e2d9c6"/>
    <rect x="518" y="224" width="4" height="118" rx="12" fill="#caa14a"/>
    <text x="538" y="252" fill="#211f1a" font-family="Georgia, serif" font-size="14" font-weight="600">Fairness in ML</text>
    <text x="538" y="270" fill="#8a8478" font-family="system-ui, sans-serif" font-size="10">3 papers</text>
    <rect x="538" y="284" width="72" height="18" rx="9" fill="#e6efe9" stroke="#c4dccd"/>
    <text x="574" y="297" fill="#1f4636" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">CS · ethics</text>

    <rect x="784" y="224" width="250" height="118" rx="12" fill="#fffdf8" stroke="#e2d9c6"/>
    <rect x="784" y="224" width="4" height="118" rx="12" fill="#caa14a"/>
    <text x="804" y="252" fill="#211f1a" font-family="Georgia, serif" font-size="14" font-weight="600">Causal Inference</text>
    <text x="804" y="270" fill="#8a8478" font-family="system-ui, sans-serif" font-size="10">3 papers</text>
  </g>

  <!-- excluded section -->
  <text x="252" y="390" fill="#1f4636" font-family="Georgia, serif" font-size="16" font-weight="600">Excluded collections</text>
  <text x="252" y="408" fill="#5a564c" font-family="system-ui, sans-serif" font-size="11">Empty folders, single-paper collections, and unfiled papers  not used in analysis.</text>

  <g>
    <rect x="252" y="426" width="250" height="96" rx="12" fill="#faf6ec" stroke="#d3c8b0" stroke-dasharray="6 4"/>
    <rect x="252" y="426" width="4" height="96" rx="12" fill="#d3c8b0"/>
    <text x="272" y="454" fill="#5a564c" font-family="Georgia, serif" font-size="13" font-weight="600">Empty folder</text>
    <text x="272" y="472" fill="#8a8478" font-family="system-ui, sans-serif" font-size="10">0 papers</text>
    <rect x="272" y="484" width="72" height="16" rx="8" fill="#ece9e1"/>
    <text x="308" y="495" fill="#5a564c" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">Empty folder</text>

    <rect x="518" y="426" width="250" height="96" rx="12" fill="#faf6ec" stroke="#d3c8b0" stroke-dasharray="6 4"/>
    <rect x="518" y="426" width="4" height="96" rx="12" fill="#d3c8b0"/>
    <text x="538" y="454" fill="#5a564c" font-family="Georgia, serif" font-size="13" font-weight="600">Single paper</text>
    <text x="538" y="472" fill="#8a8478" font-family="system-ui, sans-serif" font-size="10">1 paper</text>
    <rect x="538" y="484" width="68" height="16" rx="8" fill="#ece9e1"/>
    <text x="572" y="495" fill="#5a564c" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">Single paper</text>

    <rect x="784" y="426" width="250" height="96" rx="12" fill="#faf6ec" stroke="#d3c8b0" stroke-dasharray="6 4"/>
    <rect x="784" y="426" width="4" height="96" rx="12" fill="#d3c8b0"/>
    <text x="804" y="454" fill="#5a564c" font-family="Georgia, serif" font-size="13" font-weight="600">Library (unfiled)</text>
    <text x="804" y="472" fill="#8a8478" font-family="system-ui, sans-serif" font-size="10">5 papers</text>
    <rect x="804" y="484" width="44" height="16" rx="8" fill="#ece9e1"/>
    <text x="826" y="495" fill="#5a564c" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">Unfiled</text>
  </g>

  <text x="252" y="560" fill="#8a8478" font-family="system-ui, sans-serif" font-size="10">Illustrative UI mock  demo library, no real data or API keys.</text>
</svg>
