<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" role="img" aria-label="BindingSolution library view">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#2c5d49"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#254f3f"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1f4636" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="920" height="600" fill="#f4efe4"/>
  <rect x="0" y="0" width="228" height="600" fill="url(#green)"/>
  <line x1="228" y1="0" x2="228" y2="600" stroke="#caa14a" stroke-width="2" stroke-opacity="0.42"/>

  <text x="20" y="40" fill="#eef3ee" font-family="Georgia, serif" font-size="17" font-weight="700">BindingSolution</text>
  <text x="20" y="58" fill="#caa14a" font-family="system-ui, sans-serif" font-size="8.5" letter-spacing="1.4">AI READING ROOM</text>

  <rect x="16" y="78" width="196" height="50" rx="11" fill="rgba(255,255,255,0.14)" stroke="#caa14a" stroke-width="1.5"/>
  <text x="28" y="100" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Library</text>
  <text x="28" y="116" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="8.5">Projects &amp; papers</text>
  <rect x="170" y="94" width="30" height="18" rx="9" fill="rgba(179,137,47,0.35)"/>
  <text x="185" y="106" fill="#fff8e8" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700">4</text>

  <rect x="16" y="136" width="196" height="50" rx="11" fill="rgba(0,0,0,0.08)"/>
  <text x="28" y="158" fill="#d6e2db" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Connections</text>
  <text x="28" y="174" fill="#9fb3a8" font-family="system-ui, sans-serif" font-size="8.5">Cross-project threads</text>

  <rect x="16" y="194" width="196" height="50" rx="11" fill="rgba(0,0,0,0.08)"/>
  <text x="28" y="216" fill="#d6e2db" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Strategies</text>
  <text x="28" y="232" fill="#9fb3a8" font-family="system-ui, sans-serif" font-size="8.5">Reading plans</text>

  <rect x="16" y="252" width="196" height="50" rx="11" fill="rgba(0,0,0,0.08)"/>
  <text x="28" y="274" fill="#d6e2db" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Project specs</text>
  <text x="28" y="290" fill="#9fb3a8" font-family="system-ui, sans-serif" font-size="8.5">Paper suggestions</text>

  <rect x="228" y="0" width="692" height="84" fill="url(#hero)"/>
  <text x="248" y="48" fill="#fff" font-family="Georgia, serif" font-size="28" font-weight="600">Library</text>
  <text x="248" y="68" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="11">Your Zotero collections, categorized and ready to explore.</text>
  <rect x="790" y="26" width="110" height="32" rx="8" fill="#b3892f"/>
  <text x="845" y="46" fill="#2b2410" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Categorize all</text>

  <g transform="translate(248, 100)">
    <rect x="0" y="0" width="138" height="46" rx="8" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
