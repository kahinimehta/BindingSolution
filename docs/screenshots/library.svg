<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" role="img" aria-label="BindingSolution library view — compact layout with KPI bar above project cards">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#2c5d49"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#254f3f"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1f4636" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="980" height="640" fill="#f4efe4"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="200" height="640" fill="url(#green)"/>
  <text x="18" y="36" fill="#eef3ee" font-family="Georgia, serif" font-size="15" font-weight="700">BindingSolution</text>
  <text x="18" y="52" fill="#caa14a" font-family="system-ui, sans-serif" font-size="8" letter-spacing="1.3">AI READING ROOM</text>
  <rect x="14" y="72" width="172" height="48" rx="9" fill="rgba(255,255,255,0.14)" stroke="#caa14a" stroke-width="1.2"/>
  <rect x="22" y="82" width="20" height="20" rx="6" fill="#b3892f"/>
  <text x="48" y="96" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Library</text>
  <text x="48" y="108" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="8">Projects &amp; papers</text>

  <!-- hero band -->
  <rect x="200" y="0" width="780" height="78" fill="url(#hero)"/>
  <text x="222" y="28" fill="#caa14a" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1.1">STEP 1</text>
  <text x="222" y="52" fill="#fff" font-family="Georgia, serif" font-size="24" font-weight="600">Library</text>
  <text x="222" y="68" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="10">Your Zotero collections, categorized and ready to explore.</text>
  <rect x="842" y="24" width="118" height="30" rx="8" fill="#b3892f"/>
  <text x="901" y="43" fill="#2b2410" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">? Categorize all</text>

  <!-- content column: KPI + cards aligned left -->
  <g transform="translate(222, 92)">
    <!-- KPI row — same width as cards below -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="132" height="42" rx="8" fill="#fffdf8" stroke="#e2d9c6"/>
      <text x="66" y="20" fill="#1f4636" font-size="16" font-weight="700" text-anchor="middle" font-family="Georgia, serif">4</text>
      <text x="66" y="33" fill="#8a8478" font-size="7" text-anchor="middle" font-family="system-ui, sans-serif">ACTIVE PROJECTS</text>

      <rect x="142" y="0" width="132" height="42" rx="8" fill="#fffdf8" stroke="#e2d9c6"/>
      <text x="208" y="20" fill="#1f4636" font-size="16" font-weight="700" text-anchor="middle" font-family="Georgia, serif">13</text>
      <text x="208" y="33" fill="#8a8478" font-size="7" text-anchor="middle" font-family="system-ui, sans-serif">PAPERS</text>

      <rect x="284" y="0" width="132" height="42" rx="8" fill="#fffdf8" stroke="#e2d9c6"/>
      <text x="350" y="20" fill="#1f4636" font-size="16" font-weight="700" text-anchor="middle" font-family="Georgia, serif">2</text>
      <text x="350" y="33" fill="#8a8478" font-size="7" text-anchor="middle" font-family="system-ui, sans-serif">EXCLUDED</text>

      <rect x="426" y="0" width="132" height="42" rx="8" fill="#fffdf8" stroke="#e2d9c6"/>
      <text x="492" y="20" fill="#1f4636" font-size="16" font-weight="700" text-anchor="middle" font-family="Georgia, serif">web</text>
      <text x="492" y="33" fill="#8a8478" font-size="7" text-anchor="middle" font-family="system-ui, sans-serif">SOURCE</text>
    </g>

    <!-- overview -->
    <text x="0" y="72" fill="#8a8478" font-family="system-ui, sans-serif" font-size="8" letter-spacing="0.8">OVERVIEW</text>
    <text x="0" y="90" fill="#1f4636" font-family="Georgia, serif" font-size="14" font-weight="600">Your projects</text>
    <text x="0" y="106" fill="#5a564c" font-family="system-ui, sans-serif" font-size="10">Collections with 2+ papers — categorize and analyze these.</text>

    <!-- project cards -->
    <g filter="url(#shadow)">
      <rect x="0" y="120" width="214" height="108" rx="10" fill="#fffdf8" stroke="#e2d9c6"/>
      <rect x="0" y="120" width="4" height="108" rx="10" fill="#caa14a"/>
      <text x="14" y="146" fill="#211f1a" font-family="Georgia, serif" font-size="13" font-weight="600">Graph Neural Networks</text>
      <text x="14" y="162" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9">4 papers</text>
      <rect x="14" y="174" width="78" height="16" rx="8" fill="#e6efe9" stroke="#c4dccd"/>
      <text x="53" y="185" fill="#1f4636" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">ML · applied</text>

      <rect x="224" y="120" width="214" height="108" rx="10" fill="#fffdf8" stroke="#e2d9c6"/>
      <rect x="224" y="120" width="4" height="108" rx="10" fill="#caa14a"/>
      <text x="238" y="146" fill="#211f1a" font-family="Georgia, serif" font-size="13" font-weight="600">Fairness in ML</text>
      <text x="238" y="162" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9">3 papers</text>

      <rect x="448" y="120" width="214" height="108" rx="10" fill="#fffdf8" stroke="#e2d9c6"/>
      <rect x="448" y="120" width="4" height="108" rx="10" fill="#caa14a"/>
      <text x="462" y="146" fill="#211f1a" font-family="Georgia, serif" font-size="13" font-weight="600">Causal Inference</text>
      <text x="462" y="162" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9">3 papers</text>
    </g>

    <!-- excluded -->
    <text x="0" y="262" fill="#1f4636" font-family="Georgia, serif" font-size="13" font-weight="600">Excluded collections</text>
    <text x="0" y="278" fill="#5a564c" font-family="system-ui, sans-serif" font-size="9">Empty folders, single-paper collections, and unfiled papers.</text>

    <rect x="0" y="292" width="214" height="72" rx="10" fill="#faf6ec" stroke="#d3c8b0" stroke-dasharray="5 4"/>
    <text x="14" y="316" fill="#5a564c" font-family="Georgia, serif" font-size="11" font-weight="600">Empty folder</text>
    <text x="14" y="332" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9">0 papers</text>

    <rect x="224" y="292" width="214" height="72" rx="10" fill="#faf6ec" stroke="#d3c8b0" stroke-dasharray="5 4"/>
    <text x="238" y="316" fill="#5a564c" font-family="Georgia, serif" font-size="11" font-weight="600">Single paper</text>
    <text x="238" y="332" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9">1 paper</text>
  </g>

  <text x="222" y="620" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9">Illustrative UI mock — demo library, no real data or API keys.</text>
</svg>
