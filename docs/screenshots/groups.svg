<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Groups view with paper sets and drop suggestions">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#2c5d49"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#254f3f"/>
    </linearGradient>
    <filter id="shellShadow" x="-4%" y="-2%" width="108%" height="104%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1f4636" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1f4636" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1000" height="560" fill="#f4efe4"/>

  <g filter="url(#shellShadow)">
    <rect x="50" y="0" width="900" height="560" fill="#f4efe4"/>
    <rect x="50" y="0" width="288" height="560" fill="url(#green)"/>
    <line x1="338" y1="0" x2="338" y2="560" stroke="#caa14a" stroke-width="2" stroke-opacity="0.42"/>

    <g transform="translate(50, 0)">
      <text x="58" y="30" fill="#eef3ee" font-family="Georgia, serif" font-size="14" font-weight="700">BindingSolution</text>
      <rect x="18" y="158" width="252" height="38" rx="11" fill="rgba(255,255,255,0.14)" stroke="#caa14a" stroke-width="1.5"/>
      <text x="30" y="174" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Groups</text>
      <text x="30" y="187" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="7.5">Paper sets &amp; prune</text>

      <rect x="18" y="478" width="252" height="26" rx="10" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.08)"/>
      <text x="30" y="495" fill="#d6e2db" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.6">RUNNING</text>
      <rect x="18" y="512" width="88" height="16" rx="8" fill="rgba(0,0,0,0.2)"/>
      <circle cx="28" cy="520" r="3" fill="#7fce9b"/>
      <text x="36" y="523" fill="#cbdbd1" font-size="6.5" font-family="system-ui, sans-serif" font-weight="600">claude opus</text>
      <rect x="112" y="512" width="52" height="16" rx="8" fill="rgba(0,0,0,0.2)"/>
      <circle cx="122" cy="520" r="3" fill="#7fce9b"/>
      <text x="130" y="523" fill="#cbdbd1" font-size="6.5" font-family="system-ui, sans-serif" font-weight="600">Zotero</text>
    </g>

    <rect x="338" y="0" width="612" height="84" fill="url(#hero)"/>
    <text x="358" y="42" fill="#fff" font-family="Georgia, serif" font-size="25" font-weight="600">Groups</text>
    <text x="358" y="62" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="10">Optimal paper sets across projects &#x2014; no duplicates &#x2014; plus papers to drop.</text>
    <rect x="488" y="24" width="112" height="26" rx="8" fill="#1f4636"/>
    <text x="544" y="41" fill="#fff" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">&#x25CE; Group papers</text>

    <g transform="translate(358, 96)">
      <rect x="0" y="0" width="120" height="40" rx="8" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="60" y="19" fill="#1f4636" font-size="16" font-weight="700" text-anchor="middle" font-family="Georgia, serif">3</text>
      <text x="60" y="33" fill="#8a8478" font-size="7" text-anchor="middle" font-family="system-ui, sans-serif">PAPER SETS</text>
      <rect x="130" y="0" width="120" height="40" rx="8" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="190" y="19" fill="#1f4636" font-size="16" font-weight="700" text-anchor="middle" font-family="Georgia, serif">2</text>
      <text x="190" y="33" fill="#8a8478" font-size="7" text-anchor="middle" font-family="system-ui, sans-serif">TO DROP</text>

      <rect x="0" y="52" width="552" height="48" rx="10" fill="#f6edd6" stroke="#e2d9c6"/>
      <text x="14" y="72" fill="#1f4636" font-family="Georgia, serif" font-size="11.5" font-weight="600">Shelf organization</text>
      <text x="14" y="88" fill="#5a564c" font-family="system-ui, sans-serif" font-size="8.5">Each paper appears in at most one reading set.</text>

      <text x="0" y="118" fill="#1f4636" font-family="Georgia, serif" font-size="13" font-weight="600">Optimal paper sets</text>
      <rect x="0" y="128" width="552" height="108" rx="10" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="14" y="150" fill="#211f1a" font-family="Georgia, serif" font-size="12" font-weight="600">Fairness set</text>
      <text x="14" y="166" fill="#8a8478" font-family="system-ui, sans-serif" font-size="8.5">Papers linked by fairness across 2 projects &#x2014; each paper once.</text>
      <text x="22" y="186" fill="#5a564c" font-family="system-ui, sans-serif" font-size="8.5">&#x2022; Auditing Recommender Systems &#xB7; Fairness in ML</text>
      <text x="22" y="202" fill="#5a564c" font-family="system-ui, sans-serif" font-size="8.5">&#x2022; Counterfactual Fairness &#xB7; Causal Inference</text>

      <text x="0" y="256" fill="#1f4636" font-family="Georgia, serif" font-size="13" font-weight="600">Suggested drops</text>
      <rect x="0" y="266" width="552" height="64" rx="9" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="14" y="286" fill="#1f4636" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Auditing Recommender Systems (duplicate)</text>
      <text x="14" y="312" fill="#1f4636" font-family="system-ui, sans-serif" font-size="8">Same paper in Fairness in ML &#x2014; keep one copy on your shelf.</text>
    </g>
  </g>

  <text x="500" y="548" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Illustrative UI mock &#x2014; Groups with non-overlapping paper sets and prune suggestions.</text>
</svg>
