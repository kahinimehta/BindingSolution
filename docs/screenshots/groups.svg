      <text x="38" y="198" fill="#1f4636" font-size="7" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600">NDSEG</text>
      <text x="14" y="218" fill="#211f1a" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Gaussian-Process Factor Analysis for Low-Dimensional&#x2026;</text>
      <text x="14" y="232" fill="#8a8478" font-family="system-ui, sans-serif" font-size="7.5">NDSEG</text>
