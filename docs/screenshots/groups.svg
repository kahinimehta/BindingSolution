      <rect x="210" y="170" width="52" height="16" rx="8" fill="#efe8d8" stroke="#d3c8b0"/>
      <text x="236" y="181" fill="#5a564c" font-size="9.6" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600">18 papers</text>
