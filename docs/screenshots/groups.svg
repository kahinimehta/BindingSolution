      <rect x="234" y="556" width="20" height="16" rx="8" fill="rgba(179,137,47,0.45)"/>
      <text x="244" y="567" fill="#fff8e8" font-size="8.5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700">1</text>
      <text x="262" y="569" fill="#caa14a" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">▴</text>
