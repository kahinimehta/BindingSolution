      <text x="58" y="184" fill="#1f4636" font-size="8.2" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600">Population dyn.</text>
      <text x="14" y="202" fill="#5a564c" font-family="system-ui, sans-serif" font-size="10.2" line-height="1.4">This set gathers 18 population-coding papers from Neural Population Dynamics. They share latent-state and dimensionality-reduction methods. Read together to compare model families before diving into standalone notes.</text>
      <text x="14" y="232" fill="#211f1a" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Gaussian-Process Factor Analysis for Low-Dimensional&#x2026;</text>
      <text x="14" y="246" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9.6">Population dyn.</text>
      <line x1="14" y1="240" x2="538" y2="240" stroke="#e2d9c6"/>
      <text x="14" y="262" fill="#211f1a" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Demixed principal component analysis of neural&#x2026;</text>
      <text x="14" y="276" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9.6">Population dyn.</text>

      <text x="0" y="296" fill="#1f4636" font-family="Montserrat, system-ui, sans-serif" font-size="16.6" font-weight="600">Standalone papers</text>
      <rect x="0" y="306" width="552" height="88" rx="10" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="14" y="330" fill="#211f1a" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">A Lone Survey on Graph Representation Learning</text>
      <text x="14" y="344" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9.6">Single paper (demo) &#xB7; single-paper collection</text>
      <line x1="14" y1="352" x2="538" y2="352" stroke="#e2d9c6"/>
      <text x="14" y="368" fill="#211f1a" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Stimulus onset quenches neural variability</text>
      <text x="14" y="382" fill="#8a8478" font-family="system-ui, sans-serif" font-size="9.6">Single Neuron Recordings Memory</text>

      <text x="0" y="412" fill="#1f4636" font-family="Montserrat, system-ui, sans-serif" font-size="16.6" font-weight="600">Suggested drops</text>
      <rect x="0" y="422" width="552" height="56" rx="9" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="14" y="442" fill="#1f4636" font-family="system-ui, sans-serif" font-size="12.8" font-weight="600">Auditing Recommender Systems (duplicate)</text>
      <text x="14" y="462" fill="#5a564c" font-family="system-ui, sans-serif" font-size="10.2">Same paper in Fairness in ML &#x2014; keep one copy on your shelf.</text>
