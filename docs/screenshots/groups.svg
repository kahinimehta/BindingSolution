      <text x="357" y="124" fill="#1f4636" font-size="9.0" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600">All accounted for</text>

      <text x="0" y="148" fill="#1f4636" font-family="Montserrat, system-ui, sans-serif" font-size="16.6" font-weight="600">Optimal paper sets</text>
