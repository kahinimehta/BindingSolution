      <text x="14" y="96" fill="#5a564c" font-family="system-ui, sans-serif" font-size="10.9">Same Papers count as Library. Summary below splits unique items into sets, standalone, and drops.</text>

      <text x="0" y="124" fill="#5a564c" font-family="system-ui, sans-serif" font-size="10.9" font-weight="600">115 unique papers</text>
