      <rect x="152" y="0" width="68" height="40" rx="8" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="186" y="19" fill="#1f4636" font-size="20.5" font-weight="700" text-anchor="middle" font-family="Montserrat, system-ui, sans-serif">4</text>
      <text x="186" y="33" fill="#8a8478" font-size="7.7" text-anchor="middle" font-family="system-ui, sans-serif">PAPER SETS</text>
      <rect x="228" y="0" width="68" height="40" rx="8" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="262" y="19" fill="#1f4636" font-size="20.5" font-weight="700" text-anchor="middle" font-family="Montserrat, system-ui, sans-serif">63</text>
