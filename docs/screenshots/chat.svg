<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="Chat view with message bubbles, tall transcript, and send button">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#2c5d49"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#254f3f"/>
    </linearGradient>
    <filter id="shellShadow" x="-4%" y="-2%" width="108%" height="104%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1f4636" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1f4636" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1000" height="760" fill="#f4efe4"/>

  <g filter="url(#shellShadow)">
    <rect x="50" y="0" width="900" height="760" fill="#f4efe4"/>
    <rect x="50" y="0" width="322" height="760" fill="url(#green)"/>
    <line x1="372" y1="0" x2="372" y2="760" stroke="#caa14a" stroke-width="2" stroke-opacity="0.42"/>

    <g transform="translate(50, 0)">
      <text x="40" y="30" fill="#eef3ee" font-family="Montserrat, system-ui, sans-serif" font-size="17.9" font-weight="700">BindingSolution</text>
      <rect x="18" y="308" width="252" height="38" rx="11" fill="rgba(255,255,255,0.14)" stroke="#caa14a" stroke-width="1.5"/>
      <text x="30" y="324" fill="#fff" font-family="system-ui, sans-serif" font-size="14.1" font-weight="600">Chat</text>
      <text x="30" y="337" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="9.6">Ask about your shelf</text>
    </g>

    <rect x="372" y="0" width="578" height="84" fill="url(#hero)"/>
    <text x="382" y="42" fill="#fff" font-family="Montserrat, system-ui, sans-serif" font-size="32.0" font-weight="600">Chat</text>
    <text x="382" y="62" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="12.8">Local store context only &#x2014; no PDFs or full paper text.</text>
    <rect x="488" y="24" width="88" height="26" rx="8" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.38)"/>
    <text x="532" y="41" fill="#fff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">New chat</text>

    <g transform="translate(382, 96)">
      <rect x="0" y="0" width="552" height="122" rx="10" fill="#f6edd6" stroke="#e2d9c6"/>
      <rect x="0" y="0" width="8" height="122" rx="4" fill="#caa14a"/>
      <text x="16" y="22" fill="#211f1a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">31 collections (13 active) in your local store (web). No PDFs re-uploaded.</text>
      <text x="16" y="42" fill="#1f4636" font-size="8" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="0.5">CAN USE</text>
      <text x="16" y="56" fill="#5a564c" font-size="8.8" font-family="system-ui, sans-serif">Collection names, paper counts, categorizations (themes, summaries)</text>
      <text x="286" y="42" fill="#8b3a34" font-size="8" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="0.5">CANNOT ACCESS</text>
      <text x="286" y="56" fill="#5a564c" font-size="8.8" font-family="system-ui, sans-serif">Full paper text or PDFs</text>
      <text x="16" y="110" fill="#8a8478" font-size="8.5" font-family="system-ui, sans-serif">Run categorize, connections, groups, or spec screening to enrich what chat can cite.</text>

      <rect x="0" y="134" width="552" height="520" rx="10" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>

      <rect x="198" y="154" width="340" height="52" rx="18" fill="#1f4636" filter="url(#shadow)"/>
      <rect x="524" y="194" width="14" height="14" rx="2" fill="#1f4636"/>
      <text x="216" y="186" fill="#eef3ee" font-size="11.2" font-family="system-ui, sans-serif">Which collections share drift-diffusion themes?</text>

      <rect x="14" y="228" width="410" height="88" rx="18" fill="#fff" stroke="#e2d9c6" filter="url(#shadow)"/>
      <rect x="14" y="302" width="14" height="14" rx="2" fill="#fff" stroke="#e2d9c6"/>
      <text x="30" y="262" fill="#5a564c" font-size="10.2" font-family="system-ui, sans-serif">From your saved </text>
      <text x="118" y="262" fill="#211f1a" font-size="10.2" font-family="system-ui, sans-serif" font-weight="700">Connections</text>
      <text x="198" y="262" fill="#5a564c" font-size="10.2" font-family="system-ui, sans-serif"> map, </text>
      <text x="228" y="262" fill="#211f1a" font-size="10.2" font-family="system-ui, sans-serif" font-weight="700">NDSEG</text>
      <text x="268" y="262" fill="#5a564c" font-size="10.2" font-family="system-ui, sans-serif"> and </text>
      <text x="300" y="262" fill="#211f1a" font-size="10.2" font-family="system-ui, sans-serif" font-weight="700">Hypothesis Formation</text>
      <text x="30" y="282" fill="#5a564c" font-size="10.2" font-family="system-ui, sans-serif">both cite drift-diffusion and RNN circuit models.</text>
      <text x="30" y="304" fill="#5a564c" font-size="10.2" font-family="system-ui, sans-serif">Run Groups for paper-level sets beyond connections.</text>

      <rect x="14" y="548" width="524" height="88" rx="10" fill="#fff" stroke="#e2d9c6"/>
      <text x="26" y="580" fill="#8a8478" font-size="10.5" font-family="system-ui, sans-serif">e.g. Which collections overlap on drift-diffusion?</text>
      <circle cx="474" cy="592" r="36" fill="#1f4636" filter="url(#shadow)"/>
      <path d="M474 604 V580 M462 592 l12-12 12 12" fill="none" stroke="#eef3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="14" y="628" fill="#8a8478" font-size="8.8" font-family="system-ui, sans-serif">Enter to send &#xB7; Shift+Enter for newline &#xB7; **bold** supported</text>
    </g>
  </g>

  <text x="500" y="748" fill="#8a8478" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Illustrative UI mock &#x2014; tall transcript, green user bubbles, markdown bold in replies.</text>
</svg>
