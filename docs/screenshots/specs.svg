<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Spec Suggested papers PubMed discovery tab">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#2c5d49"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#254f3f"/>
    </linearGradient>
    <filter id="shellShadow" x="-4%" y="-2%" width="108%" height="104%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1f4636" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1f4636" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1000" height="540" fill="#f4efe4"/>

  <g filter="url(#shellShadow)">
    <rect x="50" y="0" width="900" height="540" fill="#f4efe4"/>
    <rect x="50" y="0" width="322" height="540" fill="url(#green)"/>
    <line x1="372" y1="0" x2="372" y2="540" stroke="#caa14a" stroke-width="2" stroke-opacity="0.42"/>

    <g transform="translate(50, 0)">
      <text x="40" y="30" fill="#eef3ee" font-family="Montserrat, system-ui, sans-serif" font-size="17.9" font-weight="700">BindingSolution</text>
      <rect x="18" y="246" width="252" height="38" rx="11" fill="rgba(255,255,255,0.14)" stroke="#caa14a" stroke-width="1.5"/>
      <text x="30" y="262" fill="#fff" font-family="system-ui, sans-serif" font-size="14.1" font-weight="600">Spec</text>
      <text x="30" y="275" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="9.6">Upload &amp; screen library</text>

      <rect x="18" y="458" width="252" height="26" rx="10" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.08)"/>
      <text x="30" y="475" fill="#d6e2db" font-family="system-ui, sans-serif" font-size="9.6" font-weight="600" letter-spacing="0.6">RUNNING</text>
      <rect x="18" y="492" width="88" height="16" rx="8" fill="rgba(0,0,0,0.2)"/>
      <circle cx="28" cy="500" r="3" fill="#7fce9b"/>
      <text x="36" y="503" fill="#cbdbd1" font-size="8.3" font-family="system-ui, sans-serif" font-weight="600">claude opus</text>
      <rect x="112" y="492" width="52" height="16" rx="8" fill="rgba(0,0,0,0.2)"/>
      <circle cx="122" cy="500" r="3" fill="#7fce9b"/>
      <text x="130" y="503" fill="#cbdbd1" font-size="8.3" font-family="system-ui, sans-serif" font-weight="600">Zotero</text>
    </g>

    <rect x="372" y="0" width="578" height="84" fill="url(#hero)"/>
    <text x="382" y="42" fill="#fff" font-family="Montserrat, system-ui, sans-serif" font-size="32.0" font-weight="600">Spec</text>
    <text x="382" y="62" fill="#b8cfc4" font-family="system-ui, sans-serif" font-size="12.8">Discover papers not in your library via PubMed.</text>

    <g transform="translate(382, 96)">
      <rect x="0" y="0" width="132" height="28" rx="14" fill="#fffdf8" stroke="#d3c8b0"/>
      <text x="66" y="18" fill="#5a564c" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Upload &amp; manage</text>
      <rect x="140" y="0" width="132" height="28" rx="14" fill="#1f4636"/>
      <text x="206" y="18" fill="#fff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Suggested papers</text>

      <rect x="0" y="40" width="552" height="48" rx="10" fill="#f6edd6" stroke="#e2d9c6"/>
      <text x="14" y="60" fill="#1f4636" font-family="Montserrat, system-ui, sans-serif" font-size="14.7" font-weight="600">Suggested papers (PubMed)</text>
      <text x="14" y="76" fill="#5a564c" font-family="system-ui, sans-serif" font-size="10.9">Up to five ranked hits with summary and relevance note.</text>

      <rect x="400" y="100" width="152" height="26" rx="7" fill="#b3892f"/>
      <text x="476" y="117" fill="#2b2410" font-family="system-ui, sans-serif" font-size="10.9" font-weight="700" text-anchor="middle">&#x2726; Discover new papers</text>

      <rect x="0" y="136" width="552" height="88" rx="9" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="14" y="158" fill="#1f4636" font-family="system-ui, sans-serif" font-size="13.4" font-weight="600" text-decoration="underline">Causal fairness with latent confounders</text>
      <text x="14" y="174" fill="#8a8478" font-family="system-ui, sans-serif" font-size="10.9">Smith J &#xB7; Nature Communications &#xB7; 2024</text>
      <text x="14" y="190" fill="#5a564c" font-family="system-ui, sans-serif" font-size="10.9">We study latent confounders in recommender fairness.</text>
      <rect x="14" y="198" width="420" height="20" rx="5" fill="#eef4f0" stroke="#cfe0d6"/>
      <text x="22" y="212" fill="#1f4636" font-family="system-ui, sans-serif" font-size="10.2">Strong match on fairness, causal &#x2014; not in your library.</text>

      <rect x="0" y="234" width="552" height="88" rx="9" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="14" y="256" fill="#1f4636" font-family="system-ui, sans-serif" font-size="13.4" font-weight="600" text-decoration="underline">Benchmarking fairness metrics on open datasets</text>
      <text x="14" y="272" fill="#8a8478" font-family="system-ui, sans-serif" font-size="10.9">Chen R &#xB7; PNAS &#xB7; 2023</text>
      <rect x="14" y="296" width="420" height="20" rx="5" fill="#eef4f0" stroke="#cfe0d6"/>
      <text x="22" y="310" fill="#1f4636" font-family="system-ui, sans-serif" font-size="10.2">Touches fairness themes from your spec.</text>
    </g>
  </g>

  <text x="500" y="528" fill="#8a8478" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Illustrative UI mock &#x2014; 3&#xD7; large-type shell; Suggested papers PubMed discovery tab.</text>
</svg>
