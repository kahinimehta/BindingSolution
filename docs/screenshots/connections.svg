      <text x="346" y="189" fill="#1f4636" font-size="9.6" text-anchor="middle" font-family="system-ui, sans-serif">Fairness in ML</text>
      <rect x="400" y="176" width="108" height="20" rx="10" fill="#eef4f0" stroke="#cfe0d6"/>
      <text x="454" y="189" fill="#1f4636" font-size="9.6" text-anchor="middle" font-family="system-ui, sans-serif">LLM Evaluation</text>
      <rect x="500" y="176" width="44" height="20" rx="10" fill="#faf6ec" stroke="#d3c8b0"/>
      <text x="522" y="189" fill="#8a8478" font-size="9.6" text-anchor="middle" font-family="system-ui, sans-serif">strong</text>

      <text x="0" y="252" fill="#1f4636" font-family="Montserrat, system-ui, sans-serif" font-size="16.6" font-weight="600">Suggested groupings</text>
      <rect x="0" y="262" width="552" height="88" rx="9" fill="#fffdf8" stroke="#e2d9c6" filter="url(#shadow)"/>
      <text x="14" y="284" fill="#1f4636" font-family="system-ui, sans-serif" font-size="13.4" font-weight="600">Fairness + causal reading arc</text>
      <rect x="14" y="294" width="92" height="20" rx="10" fill="#eef4f0" stroke="#cfe0d6"/>
      <text x="60" y="307" fill="#1f4636" font-size="9.6" text-anchor="middle" font-family="system-ui, sans-serif">Fairness in ML</text>
      <rect x="112" y="294" width="108" height="20" rx="10" fill="#eef4f0" stroke="#cfe0d6"/>
      <text x="166" y="307" fill="#1f4636" font-size="9.6" text-anchor="middle" font-family="system-ui, sans-serif">Causal Inference</text>
      <text x="14" y="328" fill="#5a564c" font-family="system-ui, sans-serif" font-size="10.2">Read together for a related-work section on fairness under causal scrutiny.</text>
