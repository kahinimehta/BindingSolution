<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="BindingSolution — your AI reading room">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4636"/>
      <stop offset="1" stop-color="#142f24"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c578"/>
      <stop offset="0.5" stop-color="#b3892f"/>
      <stop offset="1" stop-color="#8f6c22"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f2e6"/>
      <stop offset="1" stop-color="#ece3cf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <ellipse cx="600" cy="40" rx="520" ry="200" fill="#ffffff" opacity="0.045"/>

  <!-- golden frame -->
  <rect x="34" y="34" width="1132" height="252" rx="18" fill="none" stroke="url(#foil)" stroke-width="2" opacity="0.62"/>

  <!-- centered content block inside frame -->
  <g transform="translate(600 160)" filter="url(#glow)">
    <g transform="translate(-358 -58)">
      <!-- book emblem -->
      <g transform="translate(0 10)">
        <rect x="0" y="8" width="18" height="96" rx="3.5" fill="url(#paper)"/>
        <rect x="24" y="0" width="18" height="104" rx="3.5" fill="url(#foil)"/>
        <rect x="48" y="12" width="18" height="92" rx="3.5" fill="#cf7a52"/>
        <rect x="72" y="4" width="18" height="100" rx="3.5" fill="url(#paper)"/>
        <g transform="translate(30 34)" fill="none" stroke="#1f4636" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 5 C 8 1, -1 1, -5 4 L -5 30 C -1 27, 8 27, 14 32"/>
          <path d="M14 5 C 20 1, 29 1, 33 4 L 33 30 C 29 27, 20 27, 14 32"/>
          <path d="M14 5 L 14 32"/>
        </g>
      </g>

      <!-- wordmark + tagline, left-aligned beside emblem -->
      <g transform="translate(112 0)">
        <text x="0" y="62" font-family="Montserrat, system-ui, sans-serif" font-size="64" font-weight="700" fill="url(#paper)" letter-spacing="0.4">
          Binding<tspan fill="url(#foil)">Solution</tspan>
        </text>
        <text x="2" y="98" font-family="Montserrat, system-ui, sans-serif" font-size="22" font-style="italic" fill="#c9d8cf">your AI reading room</text>
        <line x1="2" y1="118" x2="520" y2="118" stroke="url(#foil)" stroke-width="1.2" opacity="0.42"/>
        <text x="2" y="142" font-family="'Hanken Grotesk', system-ui, sans-serif" font-size="14" fill="#b8cfc4" letter-spacing="2.2">CATEGORIZE &#xB7; CONNECT &#xB7; READ &#xB7; MATCH</text>
      </g>
    </g>
  </g>
</svg>
