<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BindingSolution · your AI reading room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231f4636'/><path d='M30 26h30a10 10 0 0110 10v38H40a10 10 0 01-10-10z' fill='none' stroke='%23b3892f' stroke-width='5'/><path d='M50 30v44' stroke='%23b3892f' stroke-width='4'/></svg>" />
</head>
<body>
  <div id="app" class="app" data-loading="true">
    <!-- ── Sidebar ─────────────────────────────────────────────── -->
    <aside class="rail">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="34" height="34">
            <rect width="100" height="100" rx="20" fill="var(--bind-green)"/>
            <path d="M28 24h32a11 11 0 0111 11v41H39a11 11 0 01-11-11z" fill="none" stroke="var(--brass)" stroke-width="5"/>
            <path d="M50 28v48" stroke="var(--brass)" stroke-width="4"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">BindingSolution</span>
          <span class="brand-sub">reading room</span>
        </div>
      </div>

      <nav class="nav">
        <a class="nav-item" data-route="library" href="#/library">
          <span class="nav-ico">❡</span><span>Library</span>
          <span class="nav-count" data-count="projects"></span>
        </a>
        <a class="nav-item" data-route="connections" href="#/connections">
          <span class="nav-ico">⁂</span><span>Connections</span>
        </a>
        <a class="nav-item" data-route="strategies" href="#/strategies">
          <span class="nav-ico">↯</span><span>Strategies</span>
          <span class="nav-count" data-count="strategies"></span>
        </a>
        <a class="nav-item" data-route="specs" href="#/specs">
          <span class="nav-ico">✦</span><span>Project specs</span>
          <span class="nav-count" data-count="specs"></span>
        </a>
      </nav>

      <div class="rail-foot">
        <button class="btn btn-ghost btn-sync" id="sync-btn">
          <span class="sync-spin" aria-hidden="true"></span>
          <span class="sync-label">Sync library</span>
        </button>
        <div class="status-chips" id="status-chips"></div>
      </div>
    </aside>

    <!-- ── Main ────────────────────────────────────────────────── -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-title" id="view-title">Library</div>
        <div class="topbar-actions" id="view-actions"></div>
      </header>
      <div class="view" id="view"></div>
    </main>
  </div>

  <!-- ── Toasts ──────────────────────────────────────────────── -->
  <div class="toasts" id="toasts"></div>

  <!-- ── Modal host ──────────────────────────────────────────── -->
  <div class="modal-host" id="modal-host" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
